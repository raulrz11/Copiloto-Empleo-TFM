spring:
  application:
    name: backend
  datasource:
    url: jdbc:postgresql://localhost:${DB_PORT:5432}/${POSTGRES_DB:copiloto}
    username: ${POSTGRES_USER:copiloto}
    password: ${POSTGRES_PASSWORD:pgpassword}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: hf.co/bartowski/Llama-3.2-3B-Instruct-GGUF:Q4_K_M